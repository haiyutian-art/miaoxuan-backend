# Dubbo 元数据报告地址配置
dubbo.metadata-report.address=zookeeper://localhost:2181
dubbo.config-center.address=zookeeper://localhost:2181
dubbo.registry.address=zookeeper://localhost:2181
dubbo.registry.timeout=60000
dubbo.registry.check=false
dubbo.registry.file=${user.home}/dubbo-cache/dubbo.cache
dubbo.registry.simplified=true

# Dubbo 自动配置控制
dubbo.config.multiple=false
dubbo.application.register-mode=instance
spring.autoconfigure.exclude=org.apache.dubbo.spring.boot.autoconfigure.DubboAutoConfiguration

# Dubbo 应用配置
dubbo.application.name=uniapp-course-backend
dubbo.application.logger=slf4j
dubbo.application.qos-enable=false
dubbo.application.qos-accept-foreign-ip=false

# Dubbo 协议配置
dubbo.protocol.name=dubbo
dubbo.protocol.port=20880
dubbo.protocol.threads=200

# Dubbo 消费者和提供者配置
dubbo.consumer.check=false
dubbo.consumer.timeout=60000
dubbo.consumer.retries=2
dubbo.provider.timeout=60000
dubbo.provider.retries=2
dubbo.provider.delay=-1
dubbo.provider.register=true

# 应用配置
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true
spring.main.lazy-initialization=false
spring.main.register-shutdown-hook=true
spring.main.banner-mode=console

# 服务健康检查配置
management.health.redis.enabled=false
management.health.db.enabled=true
management.endpoint.health.show-details=always

# 启动诊断配置
spring.main.cloud-platform=none
spring.main.fail-on-application-event-publication-error=false
debug=true

# 错误处理配置
spring.mvc.log-resolved-exception=true
spring.mvc.throw-exception-if-no-handler-found=true
logging.level.org.springframework.boot.diagnostics=debug
logging.level.org.springframework=debug
logging.level.org.apache.dubbo=debug 